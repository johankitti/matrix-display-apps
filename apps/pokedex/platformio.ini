; Pokédex Display — 64x64 HUB75 sprite slideshow on ESP32-S3
;
; Part of the matrix-display-apps monorepo. Shared code lives in ../../packages
; (board-config, display-core, net-core, web-core, settings-core) and is pulled
; in through lib_extra_dirs below.
;
; Default env targets the Waveshare ESP32-S3-Zero ("S3 mini") board with the
; S3FH4R2 chip (4 MB flash / 2 MB quad PSRAM). For a full-size DevKitC board,
; use the [env:devkitc] environment instead:
;   pio run -e devkitc -t upload

[platformio]
default_envs = s3mini

[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
; Shared package libraries (each folder under ../../packages has a library.json).
lib_extra_dirs = ../../packages
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; serial logs over the native USB port
    -DARDUINO_USB_MODE=1
lib_deps =
    board-config
    display-core
    net-core
    web-core
    settings-core
    sleep-core
    input-core
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.0
    bitbank2/AnimatedGIF@^2.1.0
    bitbank2/PNGdec@^1.0.1
    madhephaestus/ESP32Encoder@^0.11.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.14.0
    tzapu/WiFiManager@^2.0.17

[env:s3mini]
framework = ${common.framework}
platform = ${common.platform}
board = lolin_s3_mini              ; same chip config as generic S3 mini boards
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = huge_app.csv   ; WiFiManager portal + web server need >1.3MB app
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:devkitc]
framework = ${common.framework}
platform = ${common.platform}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
